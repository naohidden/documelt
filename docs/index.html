<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>documelt - Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .badges {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
    }

    /* Drop Zone */
    .dropzone {
      border: 2px dashed #334155;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 32px;
      background: #1e293b;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: #60a5fa;
      background: #1e293b;
      box-shadow: 0 0 20px rgba(96, 165, 250, 0.1);
    }

    .dropzone-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .dropzone-text {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .dropzone-formats {
      font-size: 0.85rem;
      color: #64748b;
    }

    input[type="file"] { display: none; }

    /* Status */
    .status {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .status.loading {
      display: flex;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
    }

    .status.error {
      display: flex;
      background: #1c1317;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Meta */
    .meta {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .meta.visible { display: grid; }

    .meta-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .meta-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .meta-label {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }

    /* Tabs */
    .tabs {
      display: none;
      gap: 4px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tabs.visible { display: flex; }

    .tab {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .tab:hover { border-color: #475569; }

    .tab.active {
      background: #60a5fa;
      border-color: #60a5fa;
      color: #0f172a;
      font-weight: 600;
    }

    /* Result */
    .result {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }

    .result.visible { display: block; }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #334155;
    }

    .result-title {
      font-size: 0.85rem;
      color: #64748b;
    }

    .copy-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .copy-btn:hover {
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .result-body {
      padding: 20px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    /* Format toggle */
    .format-bar {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .format-bar.visible { display: flex; }

    .format-label {
      font-size: 0.8rem;
      color: #64748b;
    }

    .format-switch {
      display: inline-flex;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }

    .format-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.15s;
    }

    .format-btn:hover { color: #e2e8f0; }

    .format-btn.active {
      background: #60a5fa;
      color: #0f172a;
    }

    .result-actions {
      display: flex;
      gap: 8px;
    }

    /* Sample code */
    .code-panel {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .code-panel.visible { display: block; }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #334155;
    }

    .code-title {
      font-size: 0.85rem;
      color: #64748b;
    }

    .code-body {
      padding: 20px;
      overflow-x: auto;
      white-space: pre;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      color: #cbd5e1;
    }

    .code-body .c { color: #64748b; }
    .code-body .k { color: #c084fc; }
    .code-body .s { color: #86efac; }
    .code-body .f { color: #60a5fa; }

    footer {
      text-align: center;
      margin-top: 48px;
      color: #475569;
      font-size: 0.85rem;
    }

    footer a {
      color: #60a5fa;
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>documelt</h1>
      <p>Rust + WebAssembly によるブラウザ内ドキュメントテキスト抽出</p>
      <div class="badges">
        <span class="badge">PDF</span>
        <span class="badge">DOCX</span>
        <span class="badge">XLSX</span>
        <span class="badge">PPTX</span>
        <span class="badge">TXT</span>
      </div>
    </header>

    <div class="dropzone" id="dropzone">
      <div class="dropzone-icon">&#128196;</div>
      <div class="dropzone-text">ファイルをドロップ、またはクリックして選択</div>
      <div class="dropzone-formats">PDF / DOCX / XLSX / PPTX / TXT (10MB以下)</div>
    </div>

    <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx,.pptx,.txt">

    <div class="status" id="status">
      <div class="spinner"></div>
      <span id="statusText"></span>
    </div>

    <div class="meta" id="meta">
      <div class="meta-card">
        <div class="meta-value" id="metaPages">-</div>
        <div class="meta-label">Pages</div>
      </div>
      <div class="meta-card">
        <div class="meta-value" id="metaChars">-</div>
        <div class="meta-label">Characters</div>
      </div>
      <div class="meta-card">
        <div class="meta-value" id="metaSize">-</div>
        <div class="meta-label">File Size</div>
      </div>
      <div class="meta-card">
        <div class="meta-value" id="metaTime">-</div>
        <div class="meta-label">Time</div>
      </div>
    </div>

    <div class="format-bar" id="formatBar">
      <span class="format-label">Output</span>
      <div class="format-switch">
        <button class="format-btn active" id="formatText" type="button">Text</button>
        <button class="format-btn" id="formatMarkdown" type="button">Markdown</button>
      </div>
    </div>

    <div class="code-panel" id="codePanel">
      <div class="code-header">
        <span class="code-title">この設定での呼び出し方</span>
        <button class="copy-btn" id="copyCodeBtn">Copy</button>
      </div>
      <div class="code-body" id="codeBody"></div>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="result" id="result">
      <div class="result-header">
        <span class="result-title" id="resultTitle">Extracted Text</span>
        <span class="result-actions">
          <button class="copy-btn" id="downloadBtn">Download</button>
          <button class="copy-btn" id="copyBtn">Copy</button>
        </span>
      </div>
      <div class="result-body" id="resultBody"></div>
    </div>

    <footer>
      <p>
        <a href="https://github.com/NAOHIDEOTA/documelt">GitHub</a>
        &nbsp;/&nbsp;
        <a href="https://www.npmjs.com/package/documelt">npm</a>
        &nbsp;/&nbsp;
        Powered by Rust + WebAssembly
      </p>
    </footer>
  </div>

  <script type="module">
    import init, { extract } from '../pkg/documelt.js';
    import { renderMarkdown } from './markdown.js';

    let wasmReady = false;

    // 現在の抽出結果と表示状態
    const state = {
      texts: [],
      blocks: [],
      ext: '',
      filename: '',
      format: 'text',   // 'text' | 'markdown'
      page: -1,         // -1 = All
    };

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const meta = document.getElementById('meta');
    const tabs = document.getElementById('tabs');
    const result = document.getElementById('result');
    const resultBody = document.getElementById('resultBody');
    const resultTitle = document.getElementById('resultTitle');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const formatBar = document.getElementById('formatBar');
    const formatTextBtn = document.getElementById('formatText');
    const formatMdBtn = document.getElementById('formatMarkdown');
    const codePanel = document.getElementById('codePanel');
    const codeBody = document.getElementById('codeBody');
    const copyCodeBtn = document.getElementById('copyCodeBtn');

    // Init WASM
    async function ensureInit() {
      if (!wasmReady) {
        await init();
        wasmReady = true;
      }
    }

    // Drop zone events
    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        handleFile(fileInput.files[0]);
      }
    });

    // Format toggle
    formatTextBtn.addEventListener('click', () => setFormat('text'));
    formatMdBtn.addEventListener('click', () => setFormat('markdown'));

    function setFormat(format) {
      state.format = format;
      formatTextBtn.classList.toggle('active', format === 'text');
      formatMdBtn.classList.toggle('active', format === 'markdown');
      render();
    }

    // Copy / Download
    function flash(btn, label) {
      const original = btn.textContent;
      btn.textContent = label;
      setTimeout(() => { btn.textContent = original; }, 1500);
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(resultBody.textContent);
      flash(copyBtn, 'Copied!');
    });

    copyCodeBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(codeBody.textContent);
      flash(copyCodeBtn, 'Copied!');
    });

    downloadBtn.addEventListener('click', () => {
      const isMd = state.format === 'markdown';
      const base = state.filename.replace(/\.[^.]+$/, '');
      const suffix = state.page >= 0 ? '_' + (state.page + 1) : '';
      const blob = new Blob([resultBody.textContent], {
        type: (isMd ? 'text/markdown' : 'text/plain') + ';charset=utf-8',
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = base + suffix + (isMd ? '.md' : '.txt');
      a.click();
      URL.revokeObjectURL(url);
    });

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + 'B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'KB';
      return (bytes / (1024 * 1024)).toFixed(1) + 'MB';
    }

    function showStatus(text, type) {
      status.className = 'status ' + type;
      statusText.textContent = text;
    }

    function hideStatus() {
      status.className = 'status';
    }

    const unitOf = (ext) => (ext === 'xlsx' ? 'Sheet' : ext === 'pptx' ? 'Slide' : 'Page');

    /**
     * 現在の state から表示中の本文を組み立てる。
     * Text     : WASM が返した生テキスト
     * Markdown : 構造化ブロックを renderMarkdown で整形したもの
     */
    function pagesFor(format) {
      return format === 'markdown' ? state.blocks.map(renderMarkdown) : state.texts;
    }

    function currentBody() {
      const pages = pagesFor(state.format);
      if (state.page < 0) return pages.join('\n\n');
      return pages[state.page] ?? '';
    }

    /** 現在の呼び出しオプションに対応するサンプルコードを生成 */
    function sampleCode() {
      const n = state.texts.length;
      const unit = unitOf(state.ext);

      if (state.format === 'text') {
        return [
          "import { extractFromFile } from 'documelt';",
          '',
          'const result = await extractFromFile(file);',
          '',
          'console.log(result.texts);            // ' + unit + '単位のテキスト配列 (' + n + '件)',
          "console.log(result.texts.join('\\n')); // 全文を1つの文字列で",
          'console.log(result.meta);             // { filename, extension, pages, characters, time }',
        ].join('\n');
      }

      return [
        "import { extractFromFile } from 'documelt';",
        '',
        "// format: 'markdown' を渡すと texts の中身が Markdown になる",
        "const result = await extractFromFile(file, { format: 'markdown' });",
        '',
        'console.log(result.texts);            // ' + unit + '単位の Markdown 配列 (' + n + '件)',
        "console.log(result.texts.join('\\n')); // 全文を1つの Markdown 文字列で",
        '',
        '// ' + unit + ' 1件目の冒頭:',
        '// ' + firstPagePreview(),
      ].join('\n');
    }

    function firstPagePreview() {
      const first = pagesFor('markdown')[0] ?? '';
      const head = first.slice(0, 48).replace(/\n/g, '\\n');
      return head + (first.length > 48 ? '...' : '');
    }

    /** コメント・文字列・キーワードだけ最小限に色付けする */
    function highlight(code) {
      const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return code.split('\n').map((line) => {
        const idx = line.indexOf('//');
        const codePart = idx >= 0 ? line.slice(0, idx) : line;
        const comment = idx >= 0 ? line.slice(idx) : '';
        let out = esc(codePart);
        out = out.replace(/'[^'\n]*'/g, (m) => '<span class="s">' + m + '</span>');
        out = out.replace(/\b(import|from|const|await)\b/g, '<span class="k">$1</span>');
        out = out.replace(/\b(extractFromFile|console)\b/g, '<span class="f">$1</span>');
        return out + (comment ? '<span class="c">' + esc(comment) + '</span>' : '');
      }).join('\n');
    }

    function render() {
      if (state.texts.length === 0) return;

      resultBody.textContent = currentBody();

      const label = state.page < 0
        ? (state.texts.length > 1 ? 'All ' + unitOf(state.ext) + 's' : '')
        : unitOf(state.ext) + ' ' + (state.page + 1);
      const fmt = state.format === 'markdown' ? 'Markdown' : 'Text';
      resultTitle.textContent = state.filename + (label ? ' - ' + label : '') + ' (' + fmt + ')';

      downloadBtn.textContent = state.format === 'markdown' ? 'Download .md' : 'Download .txt';

      codeBody.innerHTML = highlight(sampleCode());
    }

    async function handleFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const supported = ['pdf', 'docx', 'xlsx', 'pptx', 'txt'];

      if (!supported.includes(ext)) {
        showStatus('非対応のファイル形式です: .' + ext, 'error');
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        showStatus('ファイルサイズが10MBを超えています', 'error');
        return;
      }

      showStatus(file.name + ' を解析中...', 'loading');
      meta.classList.remove('visible');
      tabs.classList.remove('visible');
      result.classList.remove('visible');
      formatBar.classList.remove('visible');
      codePanel.classList.remove('visible');

      try {
        await ensureInit();

        const buffer = await file.arrayBuffer();
        const data = new Uint8Array(buffer);

        const start = performance.now();
        const res = extract(data, ext);
        const time = (performance.now() - start) / 1000;

        hideStatus();

        if (!res.success) {
          showStatus(res.error || '抽出に失敗しました', 'error');
          return;
        }

        state.texts = res.texts;
        state.blocks = res.blocks ?? [];
        state.ext = ext;
        state.filename = file.name;
        state.page = -1;

        const joined = res.texts.join('\n');

        // Meta
        document.getElementById('metaPages').textContent = res.pages;
        document.getElementById('metaChars').textContent = joined.length.toLocaleString();
        document.getElementById('metaSize').textContent = formatSize(file.size);
        document.getElementById('metaTime').textContent = time.toFixed(3) + 's';
        meta.classList.add('visible');

        // Tabs (if multiple pages)
        tabs.innerHTML = '';
        if (res.texts.length > 1) {
          const allTab = document.createElement('div');
          allTab.className = 'tab active';
          allTab.textContent = 'All';
          allTab.addEventListener('click', () => {
            setActiveTab(allTab);
            state.page = -1;
            render();
          });
          tabs.appendChild(allTab);

          res.texts.forEach((_, i) => {
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.textContent = unitOf(ext) + ' ' + (i + 1);
            tab.addEventListener('click', () => {
              setActiveTab(tab);
              state.page = i;
              render();
            });
            tabs.appendChild(tab);
          });
          tabs.classList.add('visible');
        }

        formatBar.classList.add('visible');
        codePanel.classList.add('visible');
        result.classList.add('visible');
        render();

      } catch (err) {
        showStatus('エラー: ' + err.message, 'error');
      }
    }

    function setActiveTab(activeTab) {
      tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      activeTab.classList.add('active');
    }
  </script>
</body>
</html>
