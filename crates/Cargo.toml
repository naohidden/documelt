[package]
name = "documelt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
pdf-extract = "0.7"
calamine = "0.25"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
